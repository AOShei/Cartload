name: Release

# Builds the installers when a version tag is pushed (`git tag v0.2.0 && git push --tags`)
# and attaches them to a draft GitHub release for that tag. Publish the draft by hand after
# a look at the assets. The tag must match the version in Cargo.toml, package.json and
# src-tauri/tauri.conf.json (scripts/version.sh keeps them together).
#
# The macOS and Windows builds are unsigned: macOS shows "damaged" until the quarantine
# attribute is cleared (README), Windows shows the SmartScreen warning.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          version=$(scripts/version.sh)
          echo "version $version"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match version $version" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb, AppImage)
            # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
            os: ubuntu-22.04
            args: --bundles deb,appimage
          - name: macOS (universal dmg)
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows (msi, exe)
            os: windows-latest
            args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build and attach to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Cartload ${{ github.ref_name }}"
          releaseBody: |
            See the README for install notes per platform (Linux udev rule, macOS quarantine,
            Windows WinUSB driver for FEL mode).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Keep the bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cartload-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
