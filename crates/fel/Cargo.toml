[package]
name = "cartload-fel"
description = "Allwinner FEL USB boot protocol for the Classic Mini consoles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "cartload_fel"

[[bin]]
name = "cartload-fel"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Command-line binary and its dependencies (argument parsing, log output, hmod extraction).
cli = ["dep:anyhow", "dep:clap", "dep:flate2", "dep:tar", "dep:tracing-subscriber"]

[dependencies]
nusb = "0.2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# CLI only.
anyhow = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
