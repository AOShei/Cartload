[package]
name = "cartload-fel"
description = "Allwinner FEL USB boot protocol for the Classic Mini consoles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "cartload_fel"

[[bin]]
name = "cartload-fel"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Command-line binary and its dependencies (argument parsing, log output, hmod reading).
cli = ["dep:anyhow", "dep:cartload-hmod", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
nusb = { version = "0.2", features = ["tokio"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# CLI only. cartload-hmod without its default features: package reading and fes1.bin, no HTTP.
anyhow = { workspace = true, optional = true }
cartload-hmod = { path = "../hmod", default-features = false, optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
