<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Cartload</title>
  <desc id="d">Install hakchi and manage games on the NES, SNES and Famicom Classic Mini consoles.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6557de"/>
      <stop offset="1" stop-color="#4b3ec6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400"/></clipPath>
  </defs>

  <!-- warm grey page with a soft card on the right -->
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#1a1917"/>
    <rect x="800" y="-40" width="580" height="480" rx="40" fill="#242220"/>
    <rect x="0" y="392" width="1280" height="8" fill="#9b90ff"/>
  </g>

  <!-- the mark -->
  <g transform="translate(96 108) scale(0.72)">
    <rect width="256" height="256" rx="56" fill="url(#mark)"/>
    <path d="M60 44h136a10 10 0 0 1 10 10v124H50V54a10 10 0 0 1 10-10z" fill="#ffffff"/>
    <path d="M84 44v24h88V44z" fill="#4b3ec6" opacity="0.35"/>
    <rect x="78" y="90" width="100" height="62" rx="8" fill="#5546d4"/>
    <path d="M66 178h124v26H66z" fill="#ffffff" opacity="0.72"/>
  </g>

  <!-- the wordmark -->
  <g transform="translate(318 118) scale(3.4)" fill="none" stroke="#ece9e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.64 4.37A8 8 0 1 0 14.64 16.63"/>
    <circle cx="25.3" cy="13.5" r="5.2"/>
    <path d="M30.5 8.5V18.5"/>
    <path d="M37 18.5V8.5M37 12.5A4 4 0 0 1 41 8.5H42.5"/>
    <path d="M50.5 5.5V15.5A3 3 0 0 0 53.5 18.5H55M48 8.5H54"/>
    <path d="M61.5 2.5V18.5"/>
    <circle cx="73.2" cy="13.5" r="5.2"/>
    <circle cx="90.1" cy="13.5" r="5.2"/>
    <path d="M95.3 8.5V18.5"/>
    <circle cx="107" cy="13.5" r="5.2"/>
    <path d="M112.2 2.5V18.5"/>
  </g>

  <!-- the line -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="320" y="232" font-size="26" fill="#d9d5ce">Install hakchi. Manage your games. Sync.</text>
    <text x="320" y="268" font-size="18" fill="#a8a298">For the NES, SNES and Famicom Classic Mini consoles.</text>
    <g font-size="13" font-weight="600" fill="#b8b0ff">
      <rect x="320" y="296" width="120" height="30" rx="15" fill="#2b284a"/>
      <text x="380" y="316" text-anchor="middle">Tauri · Rust · Svelte</text>
      <rect x="452" y="296" width="178" height="30" rx="15" fill="#2b284a"/>
      <text x="541" y="316" text-anchor="middle">Linux · macOS · Windows</text>
      <rect x="642" y="296" width="72" height="30" rx="15" fill="#2b284a"/>
      <text x="678" y="316" text-anchor="middle">GPL-3</text>
    </g>
  </g>

  <!-- the console, seen from above, with three game tiles -->
  <g transform="translate(868 64)">
    <rect x="0" y="0" width="220" height="268" rx="20" fill="#d7d5d1" stroke="#8d8a85" stroke-width="1.5"/>
    <line x1="32" y1="9" x2="188" y2="9" stroke="#b9b7b3" stroke-width="3" stroke-dasharray="2 4"/>
    <rect x="12" y="20" width="196" height="208" rx="14" fill="#8e8f93" stroke="#6f7074"/>
    <rect x="32" y="76" width="156" height="24" rx="7" fill="#44454a" stroke="#2f3034"/>
    <line x1="46" y1="82" x2="46" y2="94" stroke="#8e8f93" stroke-width="1.5"/>
    <line x1="174" y1="82" x2="174" y2="94" stroke="#8e8f93" stroke-width="1.5"/>
    <path d="M104 83h12l-6 7z" fill="#8e8f93"/>
    <rect x="32" y="150" width="34" height="36" rx="5" fill="#44454a" stroke="#2f3034"/>
    <rect x="36" y="154" width="26" height="14" rx="3" fill="#6b6c70"/>
    <rect x="80" y="150" width="60" height="36" rx="6" fill="#a9aaad" stroke="#8a8b8f"/>
    <rect x="154" y="150" width="34" height="36" rx="5" fill="#44454a" stroke="#2f3034"/>
    <rect x="174" y="246" width="9" height="4" rx="2" fill="#bdbdbf" stroke="#8a8b8f"/>
  </g>
  <g transform="translate(1124 96)">
    <rect x="0" y="0" width="92" height="82" rx="10" fill="#5546d4"/>
    <rect x="0" y="100" width="92" height="82" rx="10" fill="#7a6ee3"/>
    <rect x="0" y="200" width="92" height="82" rx="10" fill="#2b284a" stroke="#3d3a36"/>
    <rect x="14" y="14" width="64" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
    <rect x="14" y="114" width="64" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
    <rect x="14" y="214" width="64" height="12" rx="6" fill="#9b90ff" opacity="0.45"/>
  </g>
</svg>
