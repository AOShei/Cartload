[package]
name = "cartload-app"
description = "Cartload desktop application (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "cartload_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is `cartload`, not `cartload-app` (tauri.conf.json `mainBinaryName` agrees).
[[bin]]
name = "cartload"
path = "src/main.rs"

[features]
default = []
# Exposes the `console_exec` command, which runs any shell line on the console. Development
# builds only: `cargo tauri dev --features dev-exec`.
dev-exec = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# Native open / save dialogs (the stock kernel dump, a kernel file for uninstall).
tauri-plugin-dialog = "2"
# Remembers the window size, position and maximised state between runs.
tauri-plugin-window-state = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "std"] }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread", "signal"] }
nusb = "0.2"
dirs = "7"
# The device crates without their CLIs; hmod and library keep their HTTP fetchers.
cartload-fel.workspace = true
cartload-console.workspace = true
cartload-hmod = { workspace = true, features = ["fetch", "bundled"] }
cartload-library = { workspace = true, features = ["fetch"] }
cartload-flow.workspace = true

[dev-dependencies]
async-trait = "0.1"
flate2 = "1"
tar = "0.4"
tempfile = "3"

[lints]
workspace = true
